name: 功能建议
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 本项目只做收信，不提供撰写、发信、SMTP 或 IMAP 功能，这类建议不会被采纳。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
